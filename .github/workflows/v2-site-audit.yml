name: V2 Site Audit

on:
  push:
    branches:
      - main
      - v2-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit V2 foundation
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path(".")
          required = [
              "index.html",
              "app.html",
              "download.html",
              "tutorial.html",
              "manifest.json",
              "sw.js",
              "offline.html",
              "robots.txt",
              "sitemap.xml",
              "js/pwa.js",
          ]

          missing = [p for p in required if not (root / p).exists()]
          if missing:
              raise SystemExit("Missing V2 foundation files: " + ", ".join(missing))

          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["start_url"] == "./", "manifest start_url must be relative"
          assert manifest["scope"] == "./", "manifest scope must be relative"

          for page in ("index.html", "app.html", "download.html", "tutorial.html"):
              text = (root / page).read_text(encoding="utf-8")
              if 'href="manifest.json"' not in text:
                  print(f"::warning file={page}::manifest.json is not linked")
              if 'js/pwa.js' not in text:
                  print(f"::warning file={page}::PWA registration script is not linked")

          data = (root / "js/data.js").read_text(encoding="utf-8")
          ids = re.findall(r'\bid\s*:\s*["\']([^"\']+)["\']', data)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          if duplicates:
              print("::warning::Duplicate catalog IDs remain: " + ", ".join(duplicates))

          placeholders = len(re.findall(r'(?:example\\.com|YOUR_[A-Z0-9_]+)', data, flags=re.I))
          if placeholders:
              print(f"::warning::{placeholders} legacy placeholder URL/token references remain in js/data.js")

          print("V2 foundation audit passed.")
          PY


      - name: JavaScript syntax
        run: |
          node --check js/data.js
          node --check js/main.js
          node --check js/security.js
          node --check js/pwa.js
          node --check js/api.js
          node --check js/live-catalog.js
          python - <<'PY'
          import re
          from pathlib import Path
          for page in ("index.html","app.html","download.html","tutorial.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S|re.I)
              for i, script in enumerate(scripts, 1):
                  if not script.strip():
                      continue
                  p=Path("/tmp") / (page.replace(".html","") + f"-inline-{i}.js")
                  p.write_text(script, encoding="utf-8")
                  # Each script block is checked independently, matching browser script boundaries.
                  import subprocess
                  subprocess.run(["node","--check",str(p)],check=True)
          PY

      - name: Live GitHub Pages smoke test
        env:
          SITE_URL: https://maxhacker001.github.io/techiegamermods/
          EXPECTED_ASSET_VERSION: 20261005-11
        run: |
          python - <<'PY'
          import os, re, sys, urllib.request
          from urllib.error import HTTPError, URLError

          site = os.environ['SITE_URL']
          version = os.environ['EXPECTED_ASSET_VERSION']
          req = urllib.request.Request(site, headers={'User-Agent':'TGM-Live-Audit/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  html = r.read().decode('utf-8', 'replace')
                  code = r.status
          except (HTTPError, URLError, TimeoutError) as e:
              raise SystemExit(f'Live GitHub Pages check failed: {e}')

          if code != 200:
              raise SystemExit(f'Live GitHub Pages returned HTTP {code}')

          required = [
              f'css/style.css?v={version}',
              f'js/pwa.js?v={version}',
              f'js/site-ui.js?v={version}',
              f'js/live-catalog.js?v={version}',
              f'js/home-sections.js?v={version}',
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Live GitHub Pages is serving an older HTML build. Missing: ' + ', '.join(missing))

          if 'id="menuToggle"' not in html or 'id="sidebar"' not in html:
              raise SystemExit('Live GitHub Pages is missing the drawer shell.')

          print(f'Live GitHub Pages check passed: {site}')
          print(f'HTTP {code}; expected frontend asset version {version} is live.')
          PY
