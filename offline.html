<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f0c">
  <title>Offline — Techie Gamer Mods</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0f0c;color:#e6fff4;font-family:Segoe UI,Roboto,Arial,sans-serif;text-align:center}
    .box{max-width:520px;padding:28px;border:1px solid rgba(0,255,156,.25);border-radius:20px;background:#121a16;box-shadow:0 0 40px rgba(0,255,156,.12)}
    h1{color:#00ff9c;margin-top:0}
    p{line-height:1.6;color:#9fbfb1}
    button{border:0;border-radius:12px;padding:13px 20px;background:#00ff9c;color:#07100c;font-weight:800}
  </style>
</head>
<body>
  <main class="box">
    <h1>You're offline</h1>
    <p>Techie Gamer Mods could not reach the network. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
